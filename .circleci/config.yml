version: 2.1

jobs:
  build-debug:
    docker:
      - image: cimg/android:2024.11.1
    resource_class: large
    environment:
      GRADLE_VERSION: "8.11.1"
    steps:
      - checkout
      - run:
          name: Install Android platform 36 and build tools
          command: |
            yes | sdkmanager --licenses > /dev/null || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run:
          name: Create Gradle wrapper
          command: |
            cd /tmp
            curl -fsSL -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
            unzip -q gradle.zip -d /tmp
            cd ~/project
            "/tmp/gradle-${GRADLE_VERSION}/bin/gradle" wrapper --gradle-version "${GRADLE_VERSION}"
      - run:
          name: Build debug APK
          command: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - store_artifacts:
          path: app/build/outputs/apk/debug
          destination: apk

workflows:
  build:
    jobs:
      - build-debug
